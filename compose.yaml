services:
  db:
    image: postgres:18
    # Local development credentials only. Bound to 127.0.0.1 so nothing
    # outside this machine can reach the database.
    environment:
      POSTGRES_USER: issues_user
      POSTGRES_PASSWORD: issues_password
      POSTGRES_DB: issue_tracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql, not .../data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issues_user -d issue_tracker"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
